<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Velbrant Studios">
  <!--
    Placeholder mark until the brand has a real logo.

    It is the two shapes the site already owns: an Abyss Blue ground and the
