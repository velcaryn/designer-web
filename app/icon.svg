<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="VelBiz Digital">
<!--
  Favicon: the VB mark in white on the Abyss Blue tile.

  WHY NOT THE SUPPLIED ARTWORK AS-IS. assets/source/brand/VB-Final.svg is a
  black mark on a white square. A favicon sits on browser chrome whose
  colour is unknown and often light, so a white square reads as a blank
  tile, and its sharp corners match no OS icon convention. The blue
  rounded tile is kept: it is what the brand has been recognised by,
  and it works on a light tab strip and a dark one.

  The transform centres the mark by its own bounds rather than by the
  source square, because the glyph is landscape (876x483) inside a
  1095 square and centring by the square would sit it low.
-->
