<!--
  The VB monogram, replacing the previous mark. Sourced from
  public/Logo/VB-logo-rework-SVG.svg, the new logo supplied for the site.

  SAME TWO CHANGES AS THE MARK THIS REPLACES, FOR THE SAME REASONS:

  1. Renders in currentColor rather than a baked-in fill, so this one
     file works on the white header and the near-black demo legal bar
     alike, wherever it is used as an inline <svg> or CSS mask rather
     than a plain <img>.

  2. The viewBox is cropped to the glyph's own bounds (x 100..969,
     y 218..877 in the 1095 source square) plus a 12 unit margin, not
     the full square, so the mark can be sized by height and lands
     where it looks like it should rather than carrying dead margin.

  The uncropped two-tone original (white tile behind a dark glyph) stays
  at public/Logo/ as the supplied master.
-->
